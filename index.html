<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学海灯塔 · 原型展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-3xl w-full">
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 rounded-2xl mb-4">
        <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
      </div>
      <h1 class="text-3xl font-bold text-slate-800">学海灯塔</h1>
      <p class="text-slate-500 mt-2">原型展示页面</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <a href="mobile.html" class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition-all border border-slate-100">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-indigo-50 rounded-xl flex items-center justify-center group-hover:bg-indigo-100 transition-colors">
            <i class="fa-solid fa-mobile-screen text-xl text-indigo-600"></i>
          </div>
          <div>
            <h2 class="font-semibold text-slate-800">家长移动工作台</h2>
            <p class="text-sm text-slate-400">移动端 · 完整工作台</p>
          </div>
        </div>
      </a>

      <a href="ai-mobile.html" class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition-all border border-slate-100">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-emerald-50 rounded-xl flex items-center justify-center group-hover:bg-emerald-100 transition-colors">
            <i class="fa-solid fa-mobile-screen-button text-xl text-emerald-600"></i>
          </div>
          <div>
            <h2 class="font-semibold text-slate-800">错题本 · 家长移动端</h2>
            <p class="text-sm text-slate-400">移动端 · 错题本</p>
          </div>
        </div>
      </a>

      <a href="ai-pc.html" class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition-all border border-slate-100">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-50 rounded-xl flex items-center justify-center group-hover:bg-blue-100 transition-colors">
            <i class="fa-solid fa-desktop text-xl text-blue-600"></i>
          </div>
          <div>
            <h2 class="font-semibold text-slate-800">错题本 · PC端</h2>
            <p class="text-sm text-slate-400">桌面端 · 错题本</p>
          </div>
        </div>
      </a>

      <a href="v1.html" class="group bg-white rounded-2xl p-6 shadow-sm hover:shadow-md transition-all border border-slate-100">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-amber-50 rounded-xl flex items-center justify-center group-hover:bg-amber-100 transition-colors">
            <i class="fa-solid fa-book text-xl text-amber-600"></i>
          </div>
          <div>
            <h2 class="font-semibold text-slate-800">孩子专用错题本</h2>
            <p class="text-sm text-slate-400">单机版 · 孩子端</p>
          </div>
        </div>
      </a>
    </div>

    <p class="text-center text-sm text-slate-400 mt-10">点击上方卡片查看对应原型</p>
  </div>

</html>
